[package]
name = "bitplane-cc"
version = "0.1.0"
description = "bitplane Command Center"
edition = "2024"
publish = false

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name.
name = "bitplane_cc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "=0.0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
notify-debouncer-mini = "0.7"
tokio = { version = "1", features = ["process", "time", "sync", "macros", "rt-multi-thread", "io-util"] }
libc = "0.2"
toml = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
