[package]
name = "bitplane-cc"
version = "0.1.0"
description = "bitplane Command Center"
edition = "2024"
publish = false

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name.
name = "bitplane_cc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "=0.0.12"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
notify-debouncer-mini = "0.7"
tokio = { version = "1", features = ["process", "time", "sync", "macros", "rt-multi-thread", "io-util"] }
libc = "0.2"
toml = "1"
bitplane-protocol = { git = "https://github.com/bp-bitplane/bitplane-protocol", rev = "5cfec70a49817ef1a003d8ccd119af063d94b64f" }
# Also the rev scripts/build-sidecar.sh bundles, so cc's client and its daemon match.
bitplane-sessiond = { git = "https://github.com/bp-bitplane/bitplane-sessiond", rev = "209ff0a3b60d3a23b07ead1352f902f10ddfdf5e" }

[dev-dependencies]
tempfile = "3"

# The daemon's terminal state, which the integration tests run in-process:
# its Debug build verifies page integrity on every scroll (see sessiond's).
[profile.dev.package.libghostty-vt-sys]
debug = false
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
